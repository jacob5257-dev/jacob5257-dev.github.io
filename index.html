<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jacob Li</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at top, #f7fbff 0%, #eef4ff 45%, #e8ecf7 100%);
        color: #172033;
      }

      main {
        width: min(90vw, 520px);
        padding: 2.5rem 2rem;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 45px rgba(36, 54, 85, 0.15);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 2.6rem);
      }

      p {
        margin: 0.75rem 0 1.75rem;
        color: #4f5e7c;
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.75rem;
      }

      a {
        display: block;
        padding: 0.75rem 1rem;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #4568dc, #3b82f6);
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }

      a:hover,
      a:focus-visible {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(69, 104, 220, 0.3);
        filter: brightness(1.04);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jacob Li</h1>
      <p>Welcome to my personal website.</p>
      <ul>
        <li><a href="mailto:jacob@jacob5257.com">Email</a></li>
        <li><a href="https://www.linkedin.com/in/jacobli26">LinkedIn</a></li>
      </ul>
    </main>
  </body>
</html>
